name: WORLD LIFE - Test & Build

# 注意：このリポジトリの GitHub Pages は既存ゲームが使用中のため、
# ここでは公開（deploy）は行わず、テストとビルドのみ実行する。
# 試遊URLの公開方法はユーザー決定後に追加する。

on:
  push:
    branches: [main, ccr-af9b15ca-snitsp]
    paths: ['world-life/**', '.github/workflows/world-life-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: world-life
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: world-life/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: world-life-dist
          path: world-life/dist
